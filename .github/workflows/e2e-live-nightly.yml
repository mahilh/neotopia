name: E2E Live (nightly)

# Heavy, LIVE-Supabase E2E flows that are DELIBERATELY off the merge-blocking path. The two-context lobby
# handshakes here each do several anonymous sign-ins and would flake on Supabase's per-IP hourly rate limit if
# run on every push/PR — exactly why the heavy flows (two-human, phase-over-wire) were kept off the blocking CI
# (see e2e.yml's note). A nightly cron gives them real automated coverage without ever gating a merge.
#
# Currently runs: flow-mode-live.e2e.js (T3 S18) — the real lobby Flow toggle (data-testid="mode-flow" · T1
# 5d759aa) → game_sessions.mode='flow' + the persisted 9-tile/15s Flow clock, verified against live Postgres.
# Also runs: draw-ui-live.e2e.js (T3 S23 · added to this workflow T2 S24) · a real authenticated room's
# offer-draw routed through the atomic draw_card_for_seat RPC · asserts the RPC POST fired (vs the local
# fallback) and exactly one offer card moves to a single hand · pairs with the draw-rpc-concurrency proof.
# Also runs: backend-recovery-live.e2e.js (T3 S27 · added to this workflow T2 S28) · blocks ONLY the realtime
# websocket on a live backend and asserts the app returns to ONLINE, not merely that it retries · the honest
# half of the recovery claim that backend-down.e2e.js (merge gate) cannot make.
# New heavy live-DB flows belong here too (this is the home for "needs Supabase, too flaky to merge-gate").
# Whatever you add, add it to the ONE playwright invocation below · the skip-guard step reads that run's
# results.json and fails the job if any live spec skipped itself for want of credentials.
#
# REQUIRES repo secrets: VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY (the same pair e2e.yml / bot-health.yml use).
# Playwright's webServer (playwright.config.js · reuseExistingServer: !CI) starts the dev server itself in CI —
# no manual `npm run dev` / wait-on step (one would collide on port 5173).

on:
  schedule:
    - cron: '0 5 * * *'    # 05:00 UTC daily (offset from bot-health's 06:00 · separate runner IP regardless)
  workflow_dispatch: {}     # manual trigger from the Actions tab

concurrency:
  group: e2e-live-nightly   # never overlap two live-E2E runs (their anon sign-ins would share the per-IP rate budget)
  cancel-in-progress: false

jobs:
  flow-live:
    name: Live-DB Flow mode E2E
    runs-on: ubuntu-latest
    # 15 was sized for two specs. backend-recovery-live measured 3.0m locally on its own (it waits out a
    # real websocket death and a real re-subscribe · the waiting IS the test), so three specs no longer
    # fit comfortably. Raised with headroom for a cold runner rather than discovered by a timeout.
    # 25 -> 40 in T2 S30 for four-player-live: it sets its own 240s per-test budget (spec :67) and
    # spaces its four sign-ins 6s apart on purpose.
    timeout-minutes: 55  # 40 -> 55 in T2 S32 for the three specs added below
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # backend-recovery-live.e2e.js (T3 S27) joins here in T2 S28. T3 wrote it as a requirement it could
      # not fulfil itself · .github/ is not their lane, so the spec had existed without ever executing.
      # It needs no fixture room (it subscribes to a deliberately ABSENT room id) and blocks only the
      # realtime WEBSOCKET, leaving HTTP up, so it costs exactly ONE anonymous sign-in like its siblings.
      #
      # ONE run, both reporters. The list output stays human-readable in the log and the JSON file is
      # what the skip-guard below reads · re-running the spec to collect JSON would spend a second
      # anonymous sign-in against the very per-IP budget that put these specs on a nightly in the
      # first place.
      # four-player-live.e2e.js (T3 S29) joins here in T2 S30, on T3's explicit reinstated ask and NOT
      # before: they withdrew it while it had never executed, then it went green against production
      # (room MAPUBQ · 24 turns · 54 placements · every seat played), and only then asked for it. Wiring
      # an unproven live spec into a nightly manufactures exactly the green tick the skip-guard below
      # exists to prevent. It is the most sign-in-expensive spec in the repo · FOUR anonymous sessions
      # plus one on teardown, against a budget of 30/hour per IP (measured live · docs/ANON_SIGNIN_BUDGET.md).
      # That is affordable once a night on a dedicated runner IP and is affordable nowhere else, which is
      # the whole reason this workflow exists. The concurrency group above keeps two runs from sharing it.
      # T2 S32 · three more specs that ran in NO workflow, routed here by T3. All three need a live
      # backend, so the nightly is their home, and they join the ONE invocation so the skip-guard
      # below covers them too.
      #   two-human      · the ONLY proof the two-player lobby handshake works, and it gated nothing
      #   phase-over-wire· terminal phase propagating to both tabs over postgres_changes
      #   seat-colors-live· every seat colour the client can send is one the CHECK accepts
      # Sign-in cost is now affordable: the per-IP ceiling went 30 -> 150 this week (T2 S31), and this
      # job is serialized by the concurrency group above so it never shares the hour with itself.
      #
      # T2 S37 · solo-host.e2e.js joins · the LAST spec in this repo that ran in no workflow at all
      # (practice.e2e.js was the other, and went to the MERGE GATE instead because it mints zero
      # identities). This one cannot go on the gate: it costs 4 anonymous sign-ins per run by its own
      # measurement, which is exactly why the live specs live here. It models the arrival that dominates
      # the real funnel and that nothing else covers · ONE person, alone, with nobody to invite, against
      # a suite whose every other spec opens a second browser context. Proven before wiring, per the rule
      # in the four-player-live note above: 2 passed in 43.8s locally, adding ~1m to a 55m budget.
      #
      # T2 S38 · multiplayer-endgame-live.e2e.js joins · orphaned on arrival, and T3 flagged it themselves as
      # a fresh instance of Rule 79. Its free ENGINE half went to the MERGE GATE (folded into that workflow's
      # existing --grep invocation, so it costs nothing); the expensive half is here. 2 anon sign-ins, one per
      # human. It is the first thing to watch the four writes that land when a real room ends · the ledger
      # row, games_played, award_game_win, and two DIFFERENT per-player cluster scores rendered for a human.
      # Proven before wiring, and per Rule 82 in an ISOLATED WORKTREE on its own port rather than the shared
      # dev server this spec's own header warns about: 1 passed in 22.7s, clusters 16 v 18, award_game_win
      # 'awarded' then 'already_awarded' from the second seat, zero non-2xx.
      - name: Run the live-DB E2E suite (Flow · draw-UI · recovery · 4-player · 2-human · phase · seat colours)
        run: >
          npx playwright test
          tests/e2e/flow-mode-live.e2e.js
          tests/e2e/draw-ui-live.e2e.js
          tests/e2e/backend-recovery-live.e2e.js
          tests/e2e/four-player-live.e2e.js
          tests/e2e/two-human.e2e.js
          tests/e2e/phase-over-wire.e2e.js
          tests/e2e/seat-colors-live.e2e.js
          tests/e2e/solo-host.e2e.js
          tests/e2e/multiplayer-endgame-live.e2e.js
          tests/e2e/postgres-writeorder.e2e.js
          --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json

      # A SKIPPED live spec is indistinguishable from a passing one in the job's green tick, and every
      # live spec here is built to skip itself when creds are absent (backend-recovery-live :84 and
      # :127 · seedHelpers.loadEnv reads process.env first, then a .env.local that does not exist on a
      # runner). So a missing, renamed or empty repo secret would let this workflow report success
      # while proving nothing · a spec added to a workflow that never executes is the same silent
      # no-op class as a sync script that prints "done" without syncing. Gate on what actually ran.
      # `if: always()` so a genuine spec failure still gets this diagnosis printed alongside it.
      - name: Assert the live specs actually RAN (a skip is a silent no-op)
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("results.json")) {
              console.error("no results.json · playwright did not get far enough to report");
              process.exit(1);
            }
            const { stats = {} } = JSON.parse(fs.readFileSync("results.json", "utf8"));
            console.log("expected=" + stats.expected + " skipped=" + stats.skipped + " unexpected=" + stats.unexpected);
            if (stats.skipped > 0) {
              console.error("FAIL · " + stats.skipped + " live spec(s) SKIPPED. Supabase creds are missing from this runner, so the green tick would have been meaningless. Check the VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY repo secrets.");
              process.exit(1);
            }
            if (!stats.expected) {
              console.error("FAIL · 0 tests passed. The specs did not execute at all.");
              process.exit(1);
            }
          '

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
