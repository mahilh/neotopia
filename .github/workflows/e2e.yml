name: NeoTopia E2E

# Realtime reconnect proofs (Playwright · headless chromium). Separate from canary.yml's unit gate
# so a heavier browser run never blocks the fast quality gate · and so its logs/artifacts stand alone.
#
# SCOPED to the transport-resilience proofs. It previously ran `npx playwright test` (the WHOLE suite) · an
# unintended scope-creep as game-ux / two-human / phase-over-wire were added. The full suite does many
# anonymous sign-ins and flakes on Supabase's per-IP hourly rate limit in CI. So now: the placement guard
# runs in e2e-placement-guard.yml (game-ux · the merge-gating check); reconnect + backend-down run here; the
# heavy two-human + phase-over-wire flows are run locally / on demand, not on the blocking CI path.
#
# backend-down.e2e.js (T3 S26) joins this workflow rather than the live-nightly one because it is
# deterministic and offline BY CONSTRUCTION: it aborts every Supabase request itself, so it makes no
# successful backend call and cannot touch the anon rate limit that keeps the live suites off this path. The
# secrets below are still required (the DEV SERVER refuses to boot without them · src/lib/supabase.js throws)
# but their values are never reached.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # ── THE TIP TICK  (T2 S65) ────────────────────────────────────────────────────────────────────
  # MEASURED, because the brief called this "the merge gate at 25%" and the merge gate is fine:
  #     canary.yml (NeoTopia CI)   no concurrency block at all   56/56 commits   100%
  #     THIS workflow             cancel-in-progress: true       21/60 commits    35%
  #     e2e-placement-guard.yml   cancel-in-progress: true       45/60 commits    75%
  # 39 of the last 60 runs here were CANCELLED. Three lanes push inside the ~5 minutes a run takes,
  # so a verdict needs a quiet window longer than the run · and T3's tripwire fired twice on it, a
  # correctly-red test going unread for three nights because every run between was superseded.
  #
  # NOT a debounce, which was the first shape proposed and is worse: sleeping before the work
  # extends the quiet window a run must survive from `runtime` to `sleep + runtime`. It collapses a
  # burst into one run (cheaper) and lowers the verdict rate (the thing being fixed).
  #
  # Every half hour, off the hour because GitHub's on-the-hour schedule queue is the congested one.
  # The tick does NO work unless the tip is unmeasured and nothing is in flight · see the guard job.
  # COST, stated rather than hoped: one extra run per quiet window that follows a burst, not one per
  # tick. At ~4 still-unseeded browser contexts per run (scripts/pool-conversion.cjs) that is roughly
  # 40-80 identities a day against a ~968/day baseline. The thing it buys is that a red test cannot
  # sit unread behind a wall of cancellations.
  schedule:
    - cron: '19,49 * * * *'

# ⚠ T2 S49 · THIS WAS BRIEFLY A GROUP SHARED WITH e2e-placement-guard.yml. THAT DISABLED THAT GATE.
#
# The reasoning: both workflows fire on every push to main, both run Playwright, and both therefore run
# tests/e2e/global-teardown.js -> purge_e2e_test_data(), which deletes game_rooms project-wide with NO
# status and NO age predicate (migration 008 removed the filter deliberately) while game_sessions
# cascades from game_rooms. So they really do destroy each other's rooms on every push, and a mutex as
# wide as the resource looked like the right shape.
#
# It is not, because of how GitHub implements it: two workflows entering one group on the SAME push
# means one runs and one goes PENDING, and the next push cancels the pending one. The placement guard
# lost that race on both pushes it saw and was CANCELLED · a merge gate that cannot fail. I had written
# "GitHub cancels older pending ones itself, so this self-limits" into both headers, which is true and
# is precisely the problem. The full retraction lives in e2e-placement-guard.yml next to the numbers.
#
# WHAT SURVIVES, and it is a real improvement on its own: this workflow previously had NO concurrency
# group at all, so two pushes in quick succession ran two copies of it simultaneously and each
# teardown deleted the other's rooms. It is now serialised against ITSELF, keyed on the ref, with
# cancel-in-progress:true · the standard merge-gate semantic, which supersedes an obsolete run rather
# than queueing behind it.
#
# THE CROSS-WORKFLOW COLLISION STAYS OPEN and is not fixable at this layer. The fix is scoping the
# purge so it cannot take a room it did not create · scripts/migrations/024, written and awaiting
# approval. A local live run racing CI is untouched either way, which is what `gh run list` before a
# live run is for (documented in global-teardown.js).
#
# ⚠ THE EVENT NAME IS PART OF THE GROUP KEY (T2 S65) AND THAT IS NOT COSMETIC.
# `github.ref` is refs/heads/main for a push AND for a schedule, so one group would mean the tick
# SUPERSEDES SOMEBODY'S FRESH PUSH RUN · strictly worse than the defect it is fixing, and invisible,
# because a cancelled push run looks exactly like a quiet CI. Splitting the key means the two can
# never cancel each other; the guard job below then refuses to run a tick while anything is in
# flight, so they cannot collide either (their teardowns both purge rooms project-wide).
concurrency:
  group: neotopia-e2e-${{ github.ref }}-${{ github.event_name == 'schedule' && 'tick' || 'push' }}
  cancel-in-progress: true

jobs:
  # ── IS THIS TICK NEEDED AT ALL? ───────────────────────────────────────────────────────────────
  # The decision lives in scripts/tip-verdict-needed.cjs, not in this YAML, because the judgement is
  # the risk and a bash blob in a workflow file can never be unit-tested or mutation-proven. It has
  # 14 tests; the two that matter assert that a push or pull_request run is NEVER gated, and that a
  # tick never proceeds while another run is live.
  needed:
    name: Does the tip still need a verdict?
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/tip-verdict-needed.cjs --workflow e2e.yml --event "${{ github.event_name }}" --sha "${{ github.sha }}"

  reconnect:
    name: Reconnect + backend-down E2E
    needs: needed
    # `!= 'false'`, NOT `== 'true'`, and the difference is the whole safety property. If the guard
    # ever fails to write its output · a node error, a renamed script, a GITHUB_OUTPUT that is not
    # set · then `== 'true'` is FALSE, this job is SKIPPED, and a workflow run with a skipped job
    # still reports SUCCESS. That is a green merge gate that ran nothing, which is precisely the
    # class of defect this feature exists to remove. Failing open costs at most one extra run.
    if: needs.needed.outputs.run != 'false'
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # ── ACTIVATION · THE TWO LINES  (T2 S59 · Council Decision 3, in its stated order) ──────────
      # Order was: enough users (Decision 2) -> instrument the branch (P1, d5418a7) -> these. Both
      # predecessors have landed, and the instrument runs BEFORE this does any work: the verify step
      # below reds on a dead credential before npm ci, so activation cannot proceed on a broken pool.
      #
      # WHAT THIS ACTUALLY CONVERTS, and the number is MEASURED rather than counted: run
      # 31634871378 (78210b3, before these lines) carries exactly FOUR
      #   [pool] teardown · NO CREDENTIAL for member 0 · minting anonymously
      # lines · one per playwright invocation, since global-teardown.js:51 calls signInPooledOrAnon
      # and playwright runs globalTeardown once per INVOCATION. So this workflow mints four permanent
      # anonymous identities per push, on push AND pull_request, whatever the specs contain, and with
      # these two lines they become four reuses of one pre-existing user. Member 0 · single client.
      # ⚠ I FIRST WROTE FIVE, from `grep -c "playwright test"`. One of those five matches is PROSE in
      # this file's own header ("it previously ran `npx playwright test`") · the real steps are four.
      # A grep counts TEXT and a log counts EVENTS, and when both are available the log is the one
      # that happened (Rule 81 · a number you reasoned to is a claim, and this one reached a commit
      # message before the measurement corrected it. Same instrument, same session, as 128b.)
      #
      # WHAT IT DOES NOT CONVERT, said plainly so a drop in the counter is not over-credited: the
      # BROWSER contexts still mint. Nothing calls context.addInitScript to seed a credential into a
      # page, so useAuth's pool branch takes its NO_CREDENTIAL path and signs in anonymously exactly
      # as before · which it now RECORDS rather than passing over in silence. That is T3's half and
      # it is the larger one.
      E2E_POOL_EMAIL: ${{ secrets.E2E_POOL_EMAIL }}
      E2E_POOL_PASSWORD: ${{ secrets.E2E_POOL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── T2 S58 · DOES THE FIXED CI POOL ACTUALLY AUTHENTICATE? ────────────────────────────────
      # S57 shipped the pool's app half with a rigorous proof that it CANNOT LEAK into a player's
      # bundle and zero evidence that it WORKS. This is the missing half, and it runs FIRST · before
      # npm ci and the browser · so a dead credential costs 15 seconds rather than three minutes.
      #
      # It runs the NEGATIVE control in the same invocation: a deliberately wrong password must be
      # rejected by the real endpoint. So a green step says "this check is capable of failing AND
      # the credential works", not merely the second half (Rule 120 · an assertion about a thing
      # working needs a control in the SAME run, or you have measured your own optimism).
      #
      # EXIT-CODE SEMANTIC IS DELIBERATE AND IS RULE 79d. This repo is public and `pull_request` is
      # a trigger, so a fork PR gets no secrets. That is genuinely UNMEASURED · it must SAY SO and
      # must not be read as a pass, but it must also not red a gate for a contributor who cannot
      # possibly fix it. A measured FAILURE (exit 1) reds; a missing credential (exit 2) warns.
      #
      # ── T2 S59 · THE ALIAS MAP, AND WHY IT IS HERE RATHER THAN IN EITHER LANE ─────────────────
      # Council Decision 2 created four pool users and eight secrets. The names diverged from what
      # the code reads, and nothing could have said so · measured with `gh secret list` against
      # tests/e2e/seedHelpers.js:80, which builds `E2E_POOL_EMAIL${suffix}` with suffix `_${index}`:
      #
      #     member   harness reads       repo has                  before this map
      #     0        E2E_POOL_EMAIL      E2E_POOL_EMAIL            resolves
      #     1        E2E_POOL_EMAIL_1    E2E_POOL_JOINER_EMAIL     NULL · falls back to anonymous
      #     2        E2E_POOL_EMAIL_2    E2E_POOL_P3_EMAIL         NULL
      #     3        E2E_POOL_EMAIL_3    E2E_POOL_P4_EMAIL         NULL
      #
      # Three of four users existed and were invisible to the only code that would use them, and the
      # single symptom was one console line in a Playwright log. That is a contract spanning two
      # lanes with no owner (Rule 115) · the workflow is the seam, so the reconciliation belongs
      # here: nothing is renamed, no secret is recreated, and neither lane's file is touched.
      #
      # THIS IS MEASUREMENT, NOT ACTIVATION. The Council ordering is enough users -> instrument the
      # branch -> the two env lines, and doing it out of order produces a silent regression in the
      # harness everything depends on. These names reach the VERIFY step only. The playwright steps
      # below still get nothing, so no browser converts and nothing about the specs changes yet.
      - name: Pool credentials grant a session · REUSED not minted · ALL FOUR members
        env:
          E2E_POOL_EMAIL: ${{ secrets.E2E_POOL_EMAIL }}
          E2E_POOL_PASSWORD: ${{ secrets.E2E_POOL_PASSWORD }}
          E2E_POOL_EMAIL_1: ${{ secrets.E2E_POOL_JOINER_EMAIL }}
          E2E_POOL_PASSWORD_1: ${{ secrets.E2E_POOL_JOINER_PASSWORD }}
          E2E_POOL_EMAIL_2: ${{ secrets.E2E_POOL_P3_EMAIL }}
          E2E_POOL_PASSWORD_2: ${{ secrets.E2E_POOL_P3_PASSWORD }}
          E2E_POOL_EMAIL_3: ${{ secrets.E2E_POOL_P4_EMAIL }}
          E2E_POOL_PASSWORD_3: ${{ secrets.E2E_POOL_P4_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set +e
          node scripts/verify-pool-signin.cjs --negative
          neg=$?
          node scripts/verify-pool-signin.cjs --all
          pos=$?
          set -e
          if [ $neg -eq 2 ] || [ $pos -eq 2 ]; then
            echo "::warning title=Pool UNMEASURED::A pool credential was not available to this run"
            echo "  (a fork PR cannot read repo secrets). This is NOT a pass · the question is open."
            exit 0
          fi
          [ $neg -ne 0 ] && echo "::error::the negative control did not reject a wrong password"
          [ $pos -eq 1 ] && echo "::error::a pool member exists but the harness cannot read its name"
          exit $(( neg + pos ))

      - name: Install deps
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run reconnect + backend-down E2E
        run: npx playwright test tests/e2e/reconnect.e2e.js tests/e2e/backend-down.e2e.js

      # T3 S29 asked for the ENGINE half of four-player-live on the merge gate (the LIVE half is nightly ·
      # e2e-live-nightly.yml). --grep "ENGINE" selects exactly one test, and that test drives the real
      # src/store/gameStore through a complete 4-player game with no network at all · it makes no Supabase
      # call itself. Honest about the cost rather than round it to zero: it is a second playwright
      # invocation, and globalTeardown signs in once per INVOCATION, so this step spends exactly 1 of the
      # 30/hour per-IP anon budget (measured live · docs/ANON_SIGNIN_BUDGET.md) — the test contributes 0.
      # Seat 3 turn order, endgame and scoring have been broken in production before; one sign-in is a
      # cheap standing guard against that returning. Runs in ~1s. (T2 S30)
      # T2 S38 · multiplayer-endgame-live.e2e.js's ENGINE test joins THIS INVOCATION rather than getting a
      # step of its own. globalTeardown signs in once per playwright invocation, so a second step would have
      # cost a second identity to run a test that makes no network call at all · folding it into the existing
      # --grep keeps the whole gate at exactly 1 sign-in and adds 197ms.
      # What it guards is Rule 73 at its root: it plays 30 complete 2-player games and requires that at least
      # 18 give the two seats DIFFERENT cluster scores. If the cluster term ever goes board-global again · a
      # caller passing the board total, placedBy going unstamped, a seat argument dropped in a refactor · it
      # scores exactly 0/30 and cannot squeak past. That regression was invisible for seventeen sessions
      # (S18-S35) and cost three sessions of measuring placement skill that could not exist. Measured 25/30
      # locally at 26e8b55.
      - name: Run the ENGINE games (offline · both specs · costs 1 teardown sign-in)
        run: npx playwright test tests/e2e/four-player-live.e2e.js tests/e2e/multiplayer-endgame-live.e2e.js --grep "ENGINE"

      # T2 S32 · TWO SPECS THAT RAN IN NO WORKFLOW AT ALL, routed here by T3.
      # Both are offline by construction (card-art seeds the store and reads /art/cards; preconditions
      # aborts its own requests), so they belong on the blocking path rather than the nightly · they
      # cannot touch the anon rate limit that keeps the live suites off it.
      # preconditions.e2e.js is the pointed one: its own header describes it as merge-gating and it was
      # gating nothing. A file that lies about its own role is the exact class we have been closing all
      # week, and the fix is to make the claim true rather than to soften the sentence.
      # NOTE card-art self-skips when the store seed is slow (spec :40 · deliberate anti-flake by its
      # author). That is tolerated here, but a skip is not a pass · if it starts skipping every run,
      # the guard is gone and nobody will be told.
      - name: Run card-art + preconditions E2E (offline · previously in no workflow)
        run: npx playwright test tests/e2e/card-art.e2e.js tests/e2e/preconditions.e2e.js

      # T2 S37 · PRACTICE MODE, which ran in NO WORKFLOW AT ALL until this step.
      # Practice is the only path a solo visitor has, three sessions of specs exist for it, and none of them
      # executed anywhere · including the ledger proof below, which is the most serious class of bug this
      # project has found (bots writing to the real public civilization record).
      #
      # ON THE GATE, not the nightly, and the arithmetic is T3's rather than a guess (spec header :12).
      # The spec itself mints ZERO identities: GameRoom mounts a LocalBoard whose tree contains no useAuth,
      # and test 1 measures that rather than asserting it. The RUN is what costs · global-teardown signs in
      # once per playwright INVOCATION to call purge_e2e_test_data. This step is a third invocation, so it
      # spends exactly 1 of the 30/hour per-IP budget (docs/ANON_SIGNIN_BUDGET.md) and the six tests
      # contribute 0. It is also the only spec here that passes with the backend completely unreachable.
      #
      # ~1.8m locally, dominated by ONE test (:337) that plays a practice game to its real ending · 37 turns,
      # 89s. That is the price of the ledger proof: you cannot assert "a finished game writes nothing" without
      # finishing a game. Left in a separate step so the log names it when it is the slow one.
      #
      # WIRING THIS FOUND A STALE ANNOTATION. Test :456 carried test.fail() for a defect T1 fixed in S36
      # (3d17d7f), so it was reporting expected-to-fail against working code and would have turned this gate
      # red on its first push. Removed in the same commit. A spec that runs nowhere cannot report its own rot
      # · which is the argument for this step, made by the act of adding it.
      - name: Run practice-mode E2E (zero anon sign-ins · previously in no workflow)
        run: npx playwright test tests/e2e/practice.e2e.js

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
