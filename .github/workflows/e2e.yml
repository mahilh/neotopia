name: NeoTopia E2E

# Realtime reconnect proofs (Playwright · headless chromium). Separate from canary.yml's unit gate
# so a heavier browser run never blocks the fast quality gate · and so its logs/artifacts stand alone.
#
# SCOPED to the transport-resilience proofs. It previously ran `npx playwright test` (the WHOLE suite) · an
# unintended scope-creep as game-ux / two-human / phase-over-wire were added. The full suite does many
# anonymous sign-ins and flakes on Supabase's per-IP hourly rate limit in CI. So now: the placement guard
# runs in e2e-placement-guard.yml (game-ux · the merge-gating check); reconnect + backend-down run here; the
# heavy two-human + phase-over-wire flows are run locally / on demand, not on the blocking CI path.
#
# backend-down.e2e.js (T3 S26) joins this workflow rather than the live-nightly one because it is
# deterministic and offline BY CONSTRUCTION: it aborts every Supabase request itself, so it makes no
# successful backend call and cannot touch the anon rate limit that keeps the live suites off this path. The
# secrets below are still required (the DEV SERVER refuses to boot without them · src/lib/supabase.js throws)
# but their values are never reached.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ══ SHARED WITH e2e-placement-guard.yml ON PURPOSE · A GLOBAL MUTEX FOR A GLOBAL DESTRUCTIVE OP ══
# (T2 S49 · the purge hazard T3 reinstated as Rule 109.)
#
# Every workflow that runs Playwright also runs tests/e2e/global-teardown.js, which calls
# purge_e2e_test_data(). That function is GLOBAL: it deletes game_rooms by host-username prefix with
# NO status and NO age predicate (migration 008 removed the filter deliberately), and game_sessions
# cascades from game_rooms. So a teardown does not clean up "this run" · it cleans up EVERY run.
#
# This workflow and the placement guard BOTH trigger on every push to main, so until now they ran
# simultaneously and each one's teardown destroyed the other's rooms. That is the mechanism behind a
# Placement Guard reddening on a docs-only commit, and it cost T3 at least one live run.
#
# The correct scope for a mutex is the scope of the thing it protects. The purge is project-wide, so
# the group is shared across workflows rather than keyed on ${{ github.workflow }} · which is what
# both files had, and which is exactly why it did not help.
#
# cancel-in-progress: FALSE, and that is a deliberate change from the guard's previous `true`.
# A cancelled Playwright run does not get to run its teardown, so cancelling trades a purge collision
# for an ORPHANED ROOM · and there are already 571 rooms in production whose host profile is gone and
# which the purge can therefore never reach again (measured T2 S49). GitHub keeps at most one pending
# run per group and cancels older PENDING ones itself, so this self-limits: it costs a little latency
# on a rapid series of pushes and never silently drops a teardown.
#
# THIS IS A MITIGATION, NOT THE FIX. The fix is scoping the purge itself so it cannot take a room it
# did not create · written as scripts/migrations/024, deliberately NOT applied (tonight's approval was
# scoped to 023). Serialising the callers removes the collision between OUR workflows; it does nothing
# about a local live run racing CI, which is what `gh run list` before a live run is for.
concurrency:
  group: neotopia-e2e-purge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconnect:
    name: Reconnect + backend-down E2E
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run reconnect + backend-down E2E
        run: npx playwright test tests/e2e/reconnect.e2e.js tests/e2e/backend-down.e2e.js

      # T3 S29 asked for the ENGINE half of four-player-live on the merge gate (the LIVE half is nightly ·
      # e2e-live-nightly.yml). --grep "ENGINE" selects exactly one test, and that test drives the real
      # src/store/gameStore through a complete 4-player game with no network at all · it makes no Supabase
      # call itself. Honest about the cost rather than round it to zero: it is a second playwright
      # invocation, and globalTeardown signs in once per INVOCATION, so this step spends exactly 1 of the
      # 30/hour per-IP anon budget (measured live · docs/ANON_SIGNIN_BUDGET.md) — the test contributes 0.
      # Seat 3 turn order, endgame and scoring have been broken in production before; one sign-in is a
      # cheap standing guard against that returning. Runs in ~1s. (T2 S30)
      # T2 S38 · multiplayer-endgame-live.e2e.js's ENGINE test joins THIS INVOCATION rather than getting a
      # step of its own. globalTeardown signs in once per playwright invocation, so a second step would have
      # cost a second identity to run a test that makes no network call at all · folding it into the existing
      # --grep keeps the whole gate at exactly 1 sign-in and adds 197ms.
      # What it guards is Rule 73 at its root: it plays 30 complete 2-player games and requires that at least
      # 18 give the two seats DIFFERENT cluster scores. If the cluster term ever goes board-global again · a
      # caller passing the board total, placedBy going unstamped, a seat argument dropped in a refactor · it
      # scores exactly 0/30 and cannot squeak past. That regression was invisible for seventeen sessions
      # (S18-S35) and cost three sessions of measuring placement skill that could not exist. Measured 25/30
      # locally at 26e8b55.
      - name: Run the ENGINE games (offline · both specs · costs 1 teardown sign-in)
        run: npx playwright test tests/e2e/four-player-live.e2e.js tests/e2e/multiplayer-endgame-live.e2e.js --grep "ENGINE"

      # T2 S32 · TWO SPECS THAT RAN IN NO WORKFLOW AT ALL, routed here by T3.
      # Both are offline by construction (card-art seeds the store and reads /art/cards; preconditions
      # aborts its own requests), so they belong on the blocking path rather than the nightly · they
      # cannot touch the anon rate limit that keeps the live suites off it.
      # preconditions.e2e.js is the pointed one: its own header describes it as merge-gating and it was
      # gating nothing. A file that lies about its own role is the exact class we have been closing all
      # week, and the fix is to make the claim true rather than to soften the sentence.
      # NOTE card-art self-skips when the store seed is slow (spec :40 · deliberate anti-flake by its
      # author). That is tolerated here, but a skip is not a pass · if it starts skipping every run,
      # the guard is gone and nobody will be told.
      - name: Run card-art + preconditions E2E (offline · previously in no workflow)
        run: npx playwright test tests/e2e/card-art.e2e.js tests/e2e/preconditions.e2e.js

      # T2 S37 · PRACTICE MODE, which ran in NO WORKFLOW AT ALL until this step.
      # Practice is the only path a solo visitor has, three sessions of specs exist for it, and none of them
      # executed anywhere · including the ledger proof below, which is the most serious class of bug this
      # project has found (bots writing to the real public civilization record).
      #
      # ON THE GATE, not the nightly, and the arithmetic is T3's rather than a guess (spec header :12).
      # The spec itself mints ZERO identities: GameRoom mounts a LocalBoard whose tree contains no useAuth,
      # and test 1 measures that rather than asserting it. The RUN is what costs · global-teardown signs in
      # once per playwright INVOCATION to call purge_e2e_test_data. This step is a third invocation, so it
      # spends exactly 1 of the 30/hour per-IP budget (docs/ANON_SIGNIN_BUDGET.md) and the six tests
      # contribute 0. It is also the only spec here that passes with the backend completely unreachable.
      #
      # ~1.8m locally, dominated by ONE test (:337) that plays a practice game to its real ending · 37 turns,
      # 89s. That is the price of the ledger proof: you cannot assert "a finished game writes nothing" without
      # finishing a game. Left in a separate step so the log names it when it is the slow one.
      #
      # WIRING THIS FOUND A STALE ANNOTATION. Test :456 carried test.fail() for a defect T1 fixed in S36
      # (3d17d7f), so it was reporting expected-to-fail against working code and would have turned this gate
      # red on its first push. Removed in the same commit. A spec that runs nowhere cannot report its own rot
      # · which is the argument for this step, made by the act of adding it.
      - name: Run practice-mode E2E (zero anon sign-ins · previously in no workflow)
        run: npx playwright test tests/e2e/practice.e2e.js

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
