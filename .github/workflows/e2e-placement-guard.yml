name: E2E Placement Guard

# Protects the placement-commit guard (tests/e2e/game-ux.e2e.js · T3 S12) on every push + PR.
# This is the ONE E2E we gate merges on: it is fast (~8s of test time), isolated, and catches the
# single most critical regression — the factory→element→region→hex chain failing to COMMIT an element
# to the board (the class behind the bot's totalPlaced=0 · force:true on the pulsing valid-hex is
# load-bearing · see src/index.css hexPulse + game-ux.e2e.js placeOneElement).
#
# Deliberately runs ONLY game-ux — NOT the full suite. The heavier flows (two-human, phase-over-wire)
# do many anonymous sign-ins and flake on Supabase's per-IP hourly rate limit in CI. The realtime
# reconnect proofs run in their own workflow (e2e.yml). Playwright's webServer
# (playwright.config.js · reuseExistingServer: !CI) starts the dev server itself in CI, so there is NO
# manual `npm run dev` / wait-on step here — adding one would collide on port 5173.
#
# REQUIRES repo secrets: VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY (the same pair e2e.yml already uses).
# game-ux drives the live app against Supabase (2 anon sign-ins + a globalTeardown purge) — without the
# secrets the app cannot auth and the run fails at the lobby.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ══ SHARED WITH e2e.yml · SEE THE FULL NOTE THERE (T2 S49) ═══════════════════════════════════════
# This group was `${{ github.workflow }}-${{ github.ref }}`, which serialises this workflow against
# ITSELF and against nothing else. Both this and e2e.yml trigger on every push to main, both run
# Playwright, and both therefore run global-teardown.js → purge_e2e_test_data(), which deletes rooms
# project-wide with no status or age predicate. They were destroying each other's rooms on every
# push · the mechanism behind this guard reddening on commits that touch no code.
#
# A mutex has to be as wide as the resource it protects. The purge is project-wide, so the group name
# is a CONSTANT shared across workflows rather than an interpolation of the workflow's own name.
#
# cancel-in-progress flipped true → FALSE deliberately: a cancelled Playwright run never reaches its
# teardown, so cancelling converts a collision into a permanently orphaned room, and production
# already holds 571 rooms the purge can no longer reach (measured T2 S49). GitHub keeps one pending
# run per group and cancels older pending ones itself, so a rapid push series still self-limits.
concurrency:
  group: neotopia-e2e-purge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  placement-guard:
    name: Placement commit guard (game-ux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run fast E2E guards (placement-commit + mobile-render + flow-mode)
        # game-ux: the placement-commit guard (needs Supabase). mobile: solo /game render at 375px (NO Supabase ·
        # T3 S15). flow-mode: solo Flow lifecycle — 9-tile/15s clock + end-game → FinalScore render (NO Supabase
        # WRITE · read-only · T3 S17). All fast + deterministic — the merge-gating fast E2E. One invocation = one webServer.
        run: npx playwright test tests/e2e/game-ux.e2e.js tests/e2e/mobile.e2e.js tests/e2e/flow-mode.e2e.js --reporter=list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
