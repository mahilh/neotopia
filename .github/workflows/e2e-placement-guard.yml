name: E2E Placement Guard

# Protects the placement-commit guard (tests/e2e/game-ux.e2e.js · T3 S12) on every push + PR.
# This is the ONE E2E we gate merges on: it is fast (~8s of test time), isolated, and catches the
# single most critical regression — the factory→element→region→hex chain failing to COMMIT an element
# to the board (the class behind the bot's totalPlaced=0 · force:true on the pulsing valid-hex is
# load-bearing · see src/index.css hexPulse + game-ux.e2e.js placeOneElement).
#
# Deliberately runs ONLY game-ux — NOT the full suite. The heavier flows (two-human, phase-over-wire)
# do many anonymous sign-ins and flake on Supabase's per-IP hourly rate limit in CI. The realtime
# reconnect proofs run in their own workflow (e2e.yml). Playwright's webServer
# (playwright.config.js · reuseExistingServer: !CI) starts the dev server itself in CI, so there is NO
# manual `npm run dev` / wait-on step here — adding one would collide on port 5173.
#
# REQUIRES repo secrets: VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY (the same pair e2e.yml already uses).
# game-ux drives the live app against Supabase (2 anon sign-ins + a globalTeardown purge) — without the
# secrets the app cannot auth and the run fails at the lobby.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ⚠ T2 S49 · I PUT THIS IN A SHARED GROUP WITH e2e.yml AND IT DISABLED THIS MERGE GATE. REVERTED.
#
# THE INTENT WAS SOUND AND THE MECHANISM WAS NOT. Both this workflow and e2e.yml fire on every push to
# main, both run Playwright, and both therefore run global-teardown.js → purge_e2e_test_data(), which
# deletes rooms project-wide with no status or age predicate. They do destroy each other's rooms, and
# that is a real mechanism behind this guard reddening on commits that touch no code.
#
# So I gave them one shared group with cancel-in-progress:false, and wrote into both headers that
# "GitHub keeps one pending run per group and cancels older pending ones itself, so this self-limits."
# That sentence is TRUE and the conclusion drawn from it was wrong. Two workflows entering one group on
# the same push means one RUNS and one goes PENDING · and the next push cancels the pending one. This
# guard lost that race both times:
#     289fea1 success · 1fec38f success        (before the change)
#     54f0686 CANCELLED · 48da08a CANCELLED    (after)
# A merge gate that is cancelled cannot fail, which is strictly worse than the collision it was
# fixing: a collision reddens occasionally and loudly, an absent gate is silent every time (Rule 79d ·
# a skip is not a pass, and neither is a cancel).
#
# Restored to its original group and semantics. The cross-workflow collision is real and stays open;
# the correct fix is scoping the purge itself so it cannot take a room it did not create ·
# scripts/migrations/024, awaiting approval. A CI-level mutex was the wrong layer, and I should have
# watched one run before writing "this works" into two files.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  placement-guard:
    name: Placement commit guard (game-ux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # T2 S59 · the same two lines as e2e.yml, and here for a MEASURED reason rather than for
      # symmetry. Counted from the logs of two successful runs before these lines existed: e2e.yml
      # emits four `[pool] teardown · NO CREDENTIAL` lines and this workflow emits one, so the merge
      # gate mints FIVE permanent anonymous identities per push purely to run globalTeardown.
      # Converting four of five and leaving the fifth would be tidiness winning over the measurement ·
      # the whole feature exists to stop identities being created, and this creates one every push.
      # Member 0, the teardown's single client. No spec here reads a pool credential.
      E2E_POOL_EMAIL: ${{ secrets.E2E_POOL_EMAIL }}
      E2E_POOL_PASSWORD: ${{ secrets.E2E_POOL_PASSWORD }}
      # ── MEMBER 1 · THE JOINER  (T2 S61) ────────────────────────────────────────────────────────
      # This job carried member 0 only, and game-ux.e2e.js:119 asks for member 1 for its SECOND
      # browser context. Enumerated rather than assumed: game-ux is the only one of the three specs
      # here that seeds at all (mobile and flow-mode seed nothing), and it seeds exactly two ·
      # index 0 for the host context and index 1 for the joiner. So two lines, not eight.
      #
      # THE DENOMINATOR, measured rather than carried over: 65 runs of this workflow in the last
      # 24 hours, one unseeded joiner context each, one permanent auth.users row each. That is ~65
      # identities a day from a two-line omission · about 7% of the ~968/day this whole feature
      # exists to stop, and the single largest remaining producer with a named cause.
      #
      # IT WAS ALREADY VISIBLE, WHICH IS THE POINT. T3 read it straight off the run log:
      #     [pool] game-ux joiner · browser · UNMEASURED · nothing was seeded for member 1
      # That is the five-state observable doing its job. UNMEASURED is not a failure and not a
      # fallback · it is the record saying nothing was OFFERED, which is what makes the fix env
      # rather than code. Before S60 this run was byte-identical to a converted one.
      E2E_POOL_EMAIL_1: ${{ secrets.E2E_POOL_JOINER_EMAIL }}
      E2E_POOL_PASSWORD_1: ${{ secrets.E2E_POOL_JOINER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run fast E2E guards (placement-commit + mobile-render + flow-mode)
        # game-ux: the placement-commit guard (needs Supabase). mobile: solo /game render at 375px (NO Supabase ·
        # T3 S15). flow-mode: solo Flow lifecycle — 9-tile/15s clock + end-game → FinalScore render (NO Supabase
        # WRITE · read-only · T3 S17). All fast + deterministic — the merge-gating fast E2E. One invocation = one webServer.
        run: npx playwright test tests/e2e/game-ux.e2e.js tests/e2e/mobile.e2e.js tests/e2e/flow-mode.e2e.js --reporter=list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
